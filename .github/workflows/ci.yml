name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # setup-go caches GOMODCACHE/GOCACHE keyed on go.sum; this covers the
      # Makefile-managed tools in ./bin (golangci-lint, controller-gen,
      # setup-envtest + envtest k8s binaries), whose pinned versions derive
      # from the Makefile and go.mod. Binaries are version-suffixed, so a
      # stale restore just re-installs the changed tool.
      - name: Cache Make tooling
        uses: actions/cache@v5
        with:
          path: |
            bin
            !bin/manager
          key: ${{ runner.os }}-make-tools-${{ hashFiles('Makefile', 'go.mod') }}
          restore-keys: |
            ${{ runner.os }}-make-tools-
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
      # templates/crds.yaml is generated from config/crd — fail if a schema
      # change forgot `make chart-crds`.
      - name: Chart CRDs in sync
        run: |
          make chart-crds
          git diff --exit-code charts/
      - uses: azure/setup-helm@v4
      - name: Helm lint and render
        run: |
          helm lint charts/databasus-operator
          helm template smoke charts/databasus-operator > /dev/null
          helm template smoke charts/databasus-operator --set crds.enabled=false > /dev/null

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Contract tests against pinned databasus
        run: make test-contract
