# Release artifacts off vX.Y.Z tags: image + Helm chart → GHCR, install
# manifest → GitHub release. Modeled on PrimeTime's release-server.yml.
#
# Runs on the GitHub mirror only: gitea.zen.lofi push-mirrors here, and a
# mirrored tag push is a normal PAT-authenticated push, so it triggers this
# workflow. (Gitea Actions never sees this file — .gitea/workflows/ exists,
# so gitea does not fall back to .github/workflows.)
# NB the mirror's PAT needs the `workflow` scope once this file exists, or
# gitea's syncs get refused by GitHub.
#
# GHCR auth is the workflow's own GITHUB_TOKEN (packages: write below) — no
# extra secrets. The image is a multi-arch manifest (amd64 + arm64; the arm
# leg builds under QEMU — slow but correct for a small Go binary).
#
# First-push package visibility: GHCR creates packages private and has no
# API to change that — flip databasus-operator and charts/databasus-operator
# to public once in the web UI.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # installer job creates the GitHub release
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sf1tzp/databasus-operator:${{ github.ref_name }}
            ghcr.io/sf1tzp/databasus-operator:latest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lockstep stamping from the tag: chart version = appVersion =
      # ${TAG#v}; Chart.yaml is a placeholder.
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
              <<< "${{ secrets.GITHUB_TOKEN }}"
          helm package charts/databasus-operator \
              --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/databasus-operator-$VERSION.tgz" oci://ghcr.io/sf1tzp/charts

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build install manifest pinned to this release's image
        run: make build-installer IMG=ghcr.io/sf1tzp/databasus-operator:${{ github.ref_name }}
      - name: Create GitHub release with the manifest attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/install.yaml \
              --title "$GITHUB_REF_NAME" \
              --notes "Install: \`kubectl apply -f install.yaml\`, or \`helm install databasus-operator oci://ghcr.io/sf1tzp/charts/databasus-operator --version ${GITHUB_REF_NAME#v}\`. Check the README compatibility matrix for supported databasus versions."
