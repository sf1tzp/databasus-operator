# Gitea Actions copy of .github/workflows/ci.yml — keep the two in sync by
# hand. Gitea only falls back to .github/workflows while this directory does
# not exist (see CLAUDE.md); it exists so release workflows can live in
# .github/workflows without the gitea runner attempting them.
#
# Divergence from the GitHub copy: the act_runner executes jobs in containers
# against a DinD daemon, so a compose-published port is reachable at the job
# container's default gateway (the DinD host), not localhost.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # setup-go caches GOMODCACHE/GOCACHE keyed on go.sum; this covers the
      # Makefile-managed tools in ./bin (golangci-lint, controller-gen,
      # setup-envtest + envtest k8s binaries), whose pinned versions derive
      # from the Makefile and go.mod. Binaries are version-suffixed, so a
      # stale restore just re-installs the changed tool.
      - name: Cache Make tooling
        uses: actions/cache@v5
        with:
          path: |
            bin
            !bin/manager
          key: ${{ runner.os }}-make-tools-${{ hashFiles('Makefile', 'go.mod') }}
          restore-keys: |
            ${{ runner.os }}-make-tools-
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Contract tests against pinned databasus
        run: |
          # Job containers run on the DinD daemon's bridge network, so the
          # compose-published 4005 port lives on the DinD host, not localhost.
          # The runner config injects host.docker.internal for this via
          # `--add-host=host.docker.internal:host-gateway` in container.options
          # (homelab/k8s/gitea-actions/values.yaml).
          DATABASUS_URL=http://host.docker.internal:4005 make test-contract
