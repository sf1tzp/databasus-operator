apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "databasus-operator.fullname" . }}
  labels:
    {{- include "databasus-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "databasus-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "databasus-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "databasus-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "databasus-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
          env:
            - name: DATABASUS_API_URL
              value: {{ required "databasus.apiUrl is required" .Values.databasus.apiUrl | quote }}
            - name: DATABASUS_CREDENTIALS_SECRET
              value: {{ .Values.databasus.credentials.secretName | quote }}
            {{- with .Values.databasus.credentials.secretNamespace }}
            - name: DATABASUS_CREDENTIALS_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            # Fallback credentials-secret namespace when secretNamespace is
            # unset (see cmd/main.go).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
